<!-- Folha do dia: the day is the hero. Its numeral stands on the horizon in front of the rising sun (under the small moon and the stars at night), the weekday, the month and the time beside it on the sky; the land says what it is, who organizes it and where.
     Drawn by js/flyer.js itself (assets/panfletos.js holds the activities, real rows of the agenda), so
     this artboard is always the flyer the site exports; ?atividade=<key> picks another activity and with
     it the sky of its hour (see assets/panfletos.js). -->
<div class="panfleto"></div>
<script type="module">

  drawFlyer('day', 'caminhada');
</script>
