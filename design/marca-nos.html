<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marca NOS (provisória)</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/components.css">
<style>
.marca-nos { display: flex; flex-direction: column; align-items: flex-start; gap: 32px; padding: 40px; width: 860px; background: var(--color-surface); }
.board-title { flex-shrink: 0; font-family: var(--font-display); font-size: 32px; font-weight: 800; white-space: nowrap; color: var(--color-ink); }
.board-note { align-self: stretch; flex-shrink: 0; font-family: var(--font-ui); font-size: 16px; font-weight: 500; line-height: 1.4; color: var(--color-muted); }
.lockups { display: flex; align-items: center; gap: 24px; flex-shrink: 0; }
.lockup-cabecalho-vermelho { display: flex; align-items: center; gap: 12px; padding: 14px 20px; flex-shrink: 0; background: var(--color-brand); border-radius: 6px; }
.lockup-text { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; flex-shrink: 0; }
.city { flex-shrink: 0; font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1.05; white-space: nowrap; color: var(--color-on-ink); }
.full-name { flex-shrink: 0; font-family: var(--font-ui); font-size: 14px; font-weight: 500; line-height: 1.2; white-space: nowrap; color: var(--color-on-ink); }
.lockup-fundo-claro { display: flex; align-items: center; gap: 12px; padding: 14px 20px; flex-shrink: 0; background: var(--color-ground); border-radius: 6px; }
.city-2 { flex-shrink: 0; font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1.05; white-space: nowrap; color: var(--color-ink); }
.full-name-2 { flex-shrink: 0; font-family: var(--font-ui); font-size: 14px; font-weight: 500; line-height: 1.2; white-space: nowrap; color: var(--color-muted); }
.app-icon { display: flex; align-items: center; justify-content: center; width: 132px; height: 132px; flex-shrink: 0; background: var(--color-brand); border-radius: 28px; }
.icon-sheet { display: flex; flex-direction: column; align-items: flex-start; width: 74px; height: 84px; flex-shrink: 0; background: var(--color-surface); border-radius: 4px 4px 6px 6px; box-shadow: 0 2px 4px #1C1C1E40; overflow: hidden; }
.icon-binding { align-self: stretch; height: 12px; flex-shrink: 0; background: var(--color-ink); }
.icon-perforation { display: flex; align-items: flex-start; justify-content: center; gap: 5px; padding: 3px 6px; align-self: stretch; height: 9px; flex-shrink: 0; }
.perf-dot { width: 3px; height: 3px; flex-shrink: 0; background: var(--color-faded); border-radius: 50%; }
.icon-word-wrap { display: flex; align-items: center; justify-content: center; padding: 0 0 5px; align-self: stretch; min-height: 0; flex: 1 1 0; }
.icon-word { flex-shrink: 0; font-family: var(--font-display); font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: 0.5px; white-space: nowrap; color: var(--color-ink); }
</style>
</head>
<body>
<!-- Marca NOS (provisória) -->
<div class="marca-nos">
  <span class="board-title">Marca NOS — provisória</span>
  <span class="board-note">Uma folhinha em miniatura: tira de encadernação, picote e NOS impresso. Funciona sobre o cabeçalho vermelho, sobre o fundo claro e como ícone.</span>
  <div class="nos-mark">
    <div class="nos-mark__binding"></div>
    <div class="nos-mark__perforation">
      <div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div>
    </div>
    <div class="nos-mark__word-wrap">
      <span class="nos-mark__word">NOS</span>
    </div>
  </div>
  <div class="lockups">
    <div class="lockup-cabecalho-vermelho">
      <div class="nos-mark">
        <div class="nos-mark__binding"></div>
        <div class="nos-mark__perforation">
          <div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div>
        </div>
        <div class="nos-mark__word-wrap">
          <span class="nos-mark__word">NOS</span>
        </div>
      </div>
      <div class="lockup-text">
        <span class="city">Dourados/MS</span>
        <span class="full-name">Núcleo de Organização Social</span>
      </div>
    </div>
    <div class="lockup-fundo-claro">
      <div class="nos-mark">
        <div class="nos-mark__binding"></div>
        <div class="nos-mark__perforation">
          <div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div>
        </div>
        <div class="nos-mark__word-wrap">
          <span class="nos-mark__word">NOS</span>
        </div>
      </div>
      <div class="lockup-text">
        <span class="city-2">Dourados/MS</span>
        <span class="full-name-2">Núcleo de Organização Social</span>
      </div>
    </div>
    <div class="app-icon">
      <div class="icon-sheet">
        <div class="icon-binding"></div>
        <div class="icon-perforation">
          <div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div>
        </div>
        <div class="icon-word-wrap">
          <span class="icon-word">NOS</span>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
