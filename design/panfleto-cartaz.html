<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panfleto · Cartaz</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/components.css">
<style>
.panfleto-cartaz { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 80px; width: 1080px; height: 1350px; background: var(--color-brand); overflow: hidden; }
.title { align-self: stretch; flex-shrink: 0; font-family: var(--font-display); font-size: 168px; font-weight: 800; line-height: 0.95; color: var(--color-on-ink); }
.band { display: flex; align-items: flex-start; gap: 56px; align-self: stretch; height: 504px; flex-shrink: 0; }
.date-sheet { display: flex; flex-direction: column; align-items: flex-start; width: 340px; flex-shrink: 0; background: var(--color-surface); border-radius: 4px 4px 6px 6px; overflow: hidden; }
.sheet-binding { align-self: stretch; height: 14px; flex-shrink: 0; background: var(--color-ink); }
.sheet-perforation { display: flex; align-items: flex-start; justify-content: space-between; padding: 11px 22px 0; align-self: stretch; height: 28px; flex-shrink: 0; }
.perf-dot { width: 6px; height: 6px; flex-shrink: 0; background: var(--color-faded); border-radius: 50%; }
.day-block { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 24px 24px; align-self: stretch; flex-shrink: 0; }
.day-numeral { flex-shrink: 0; font-family: var(--font-display); font-size: 204px; font-weight: 800; line-height: 0.84; letter-spacing: -2px; white-space: nowrap; color: var(--color-ink); }
.weekday { flex-shrink: 0; font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: 2.6px; white-space: nowrap; color: var(--color-brand); }
.month { flex-shrink: 0; font-family: var(--font-display); font-size: 44px; font-weight: 700; line-height: 1.1; letter-spacing: 2.6px; white-space: nowrap; color: var(--color-ink); }
.sheet-seam { align-self: stretch; height: 1px; flex-shrink: 0; background: var(--color-seam); }
.time-block { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 18px 24px 26px; align-self: stretch; flex-shrink: 0; }
.time { flex-shrink: 0; font-family: var(--font-display); font-size: 84px; font-weight: 800; line-height: 0.92; white-space: nowrap; color: var(--color-ink); }
.type { flex-shrink: 0; font-family: var(--font-display); font-size: 34px; font-weight: 600; line-height: 1.15; white-space: nowrap; color: var(--color-muted); }
.details { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; min-width: 0; align-self: stretch; flex: 1 1 0; }
.info { display: flex; flex-direction: column; align-items: flex-start; gap: 20px; align-self: stretch; flex-shrink: 0; }
.place-row { display: flex; align-items: flex-start; gap: 14px; align-self: stretch; flex-shrink: 0; }
.place-icon-box { display: flex; align-items: center; justify-content: center; width: 44px; height: 53px; flex-shrink: 0; }
.place-icon { width: 42px; height: 42px; flex-shrink: 0; color: var(--color-on-ink); }
.place { min-width: 0; flex: 1 1 0; font-family: var(--font-ui); font-size: 44px; font-weight: 600; line-height: 1.2; color: var(--color-on-ink); }
.org-row { display: flex; align-items: flex-start; gap: 14px; align-self: stretch; flex-shrink: 0; }
.sector-mark-box { display: flex; align-items: center; justify-content: center; width: 44px; height: 53px; flex-shrink: 0; }
.sector-mark { width: 26px; height: 26px; flex-shrink: 0; background: var(--color-series-1); border-radius: 3px; outline: 3px solid var(--color-on-ink); outline-offset: -1.5px; }
.org { min-width: 0; flex: 1 1 0; font-family: var(--font-ui); font-size: 44px; font-weight: 600; line-height: 1.2; color: var(--color-on-ink); }
.signature-wrap { display: flex; align-items: flex-start; justify-content: flex-end; align-self: stretch; flex-shrink: 0; }
.signature { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
.nos-mark-2 { display: block; width: 114.2px; height: 69.0px; flex-shrink: 0; overflow: visible; color: var(--color-on-ink); }
.signature-text { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; flex-shrink: 0; }
.brand { flex-shrink: 0; font-family: var(--font-display); font-size: 36px; font-weight: 800; line-height: 1.05; white-space: nowrap; color: var(--color-on-ink); }
.footer-line { flex-shrink: 0; font-family: var(--font-ui); font-size: 24px; font-weight: 500; line-height: 1.25; white-space: nowrap; color: var(--color-on-ink); }
</style>
</head>
<body>
<div class="panfleto-cartaz">
  <span class="title">BAILE DOS EDUCADORES – FESTA TROPICAL</span>
  <div class="band">
    <div class="date-sheet">
      <div class="sheet-binding"></div>
      <div class="sheet-perforation">
        <div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div><div class="perf-dot"></div>
      </div>
      <div class="day-block">
        <span class="day-numeral">31</span>
        <span class="weekday">SÁBADO</span>
        <span class="month">OUTUBRO</span>
      </div>
      <div class="sheet-seam"></div>
      <div class="time-block">
        <span class="time">21h</span>
        <span class="type">Festa</span>
      </div>
    </div>
    <div class="details">
      <div class="info">
        <div class="place-row">
          <div class="place-icon-box">
            <svg class="place-icon"><use href="assets/icons.svg#map-pin"/></svg>
          </div>
          <span class="place">Chácara do SIMTED</span>
        </div>
        <div class="org-row">
          <div class="sector-mark-box">
            <div class="sector-mark"></div>
          </div>
          <span class="org">SIMTED</span>
        </div>
      </div>
      <div class="signature-wrap">
        <div class="signature">
          <svg class="nos-mark-2" aria-hidden="true"><use href="assets/icons.svg#marca-nos"/></svg>
          <div class="signature-text">
            <span class="brand">Dourados/MS</span>
            <span class="footer-line">Agenda das organizações de Dourados</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
