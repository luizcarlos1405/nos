<!doctype html>
<html lang="pt-BR" data-scheme="light" data-sky="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa · a pintura, ao vivo</title>
<meta name="description" content="O mapa de verdade de Dourados (OpenStreetMap, pelos mapas livres do OpenFreeMap) pintado no Céu · Terra, com os 18 lugares de capoeira. Abra numa aba para mexer.">
<meta name="htmlboard" content="width=1200, height=760">
<meta name="htmlboard:label" content="claro">
<meta name="htmlboard:variant" content="?tema=escuro · escuro">
<script>
  // ?tema=escuro: the night. ?so-mapa: the map alone (tools/mapa-render.cjs photographs it for the
  // artboards); ?lat=&lon=&z= set the view, in the artboards' numbers; ?escala=2 draws the lines and
  // labels twice as large (see assets/mapa-estilo.js).
  (function () {
    var q = new URLSearchParams(location.search), root = document.documentElement;
    if (q.get('tema') === 'escuro') { root.dataset.scheme = 'dark'; root.dataset.sky = 'night'; }
    if (q.has('so-mapa')) root.dataset.bare = '';
  })();
</script>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/mapa.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: var(--role-map-land); }
  #map { position: absolute; inset: 0; }
  .live-note { position: absolute; left: 16px; bottom: 16px; z-index: 2; max-width: 30rem; padding: 12px 16px 13px;
    border-radius: var(--radius-card); background: var(--role-card); color: var(--role-ink); box-shadow: var(--role-card-shadow);
    border: 1px solid var(--role-card-border); font: 400 0.875rem/1.45 var(--font-ui); }
  .live-note b { display: block; margin-bottom: 2px; font: 750 1.0625rem/1.25 var(--font-display); letter-spacing: -0.015em; }
  .live-pin { width: 14px; height: 14px; border-radius: 50%; background: var(--role-pin); box-shadow: 0 0 0 2px var(--role-pin-ring), var(--role-pin-shadow); }
  [data-bare] .live-note, [data-bare] .maplibregl-control-container { display: none; }
  .maplibregl-ctrl-attrib { font: 400 0.6875rem/1.3 var(--font-ui); }
</style>
</head>
<body>
<div id="map"></div>
<p class="live-note"><b>O mapa de verdade, pintado no Céu · Terra</b>Ruas, bairros, parques e córregos do OpenStreetMap, pelos mapas livres do OpenFreeMap (sem chave, sem limite de visitas). Os pontos são os 18 lugares de capoeira do mapa do COMAFRO. Abra numa aba para arrastar e dar zoom.</p>
<script type="module">
  import { buildStyle } from './assets/mapa-estilo.js';
  import { PLACES } from './assets/mapa.js';

  const q = new URLSearchParams(location.search);
  const bare = q.has('so-mapa');
  const center = [Number(q.get('lon') || -54.8042), Number(q.get('lat') || -22.2155)];
  const zoom = Number(q.get('z') || 12.2);

  const map = new maplibregl.Map({
    container: 'map', style: buildStyle(undefined, { scale: Number(q.get('escala') || 1) }), center, zoom, attributionControl: false,
    preserveDrawingBuffer: bare, fadeDuration: 0, maxZoom: 18, minZoom: 9,
  });
  if (!bare) {
    map.addControl(new maplibregl.AttributionControl({ compact: true,
      customAttribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> · <a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap</a>' }), 'bottom-right');
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
    for (const p of PLACES.filter((p) => p.layer === 'capoeira')) {
      const el = document.createElement('div');
      el.className = 'live-pin';
      el.title = `${p.group} · ${p.place}`;
      new maplibregl.Marker({ element: el }).setLngLat([p.lon, p.lat]).addTo(map);
    }
  }
  window.mapa = map; // for the console
  map.on('error', (e) => console.error('mapa:', e.error && e.error.message));
  map.once('idle', () => { document.documentElement.dataset.ready = ''; });
</script>
</body>
</html>
