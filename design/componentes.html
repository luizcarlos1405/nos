<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Componentes</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/components.css">
<style>
.componentes { display: flex; flex-direction: column; align-items: flex-start; gap: 28px; padding: 40px; width: 860px; background: var(--color-surface); }
.board-title { flex-shrink: 0; font-family: var(--font-display); font-size: 32px; font-weight: 800; white-space: nowrap; color: var(--color-ink); }
.row-chips { display: flex; align-items: center; gap: 12px; padding: 16px; flex-shrink: 0; background: var(--color-ground); border-radius: 6px; }
.row-badges { display: flex; align-items: center; gap: 16px; padding: 16px; flex-shrink: 0; background: var(--color-ground); border-radius: 6px; }
.row-buttons { display: flex; align-items: center; gap: 12px; padding: 16px; flex-shrink: 0; background: var(--color-ground); border-radius: 6px; }
.row-sheet { display: flex; align-items: flex-start; gap: 24px; padding: 16px; flex-shrink: 0; background: var(--color-ground); border-radius: 6px; }
</style>
</head>
<body>
<div class="componentes">
  <span class="board-title">Componentes</span>
  <div class="row-chips">
    <div class="chip">
      <div class="chip__mark"></div>
      <span class="chip__label">Sindicatos</span>
    </div>
    <!-- Chip · Todos (ativo) -->
    <div class="chip" style="background: var(--color-ink); outline: 1px solid var(--color-ink)">
      <span class="chip__label" style="font-weight: 600; color: var(--color-on-ink)">Todos</span>
    </div>
    <div class="chip">
      <div class="chip__mark" style="background: var(--color-series-3)"></div>
      <span class="chip__label">Movimentos sociais</span>
    </div>
    <!-- Chip · Sindicatos (ativo) -->
    <div class="chip" style="background: var(--color-ink); outline: 1px solid var(--color-ink)">
      <div class="chip__mark" style="outline: 1.5px solid var(--color-on-ink); outline-offset: -0.75px"></div>
      <span class="chip__label" style="font-weight: 600; color: var(--color-on-ink)">Sindicatos</span>
    </div>
    <div class="org-select">
      <svg class="org-select__icon"><use href="assets/icons.svg#users"/></svg>
      <span class="org-select__label">Organização</span>
      <svg class="org-select__chevron"><use href="assets/icons.svg#chevron-down"/></svg>
    </div>
  </div>
  <div class="row-badges">
    <div class="badge">
      <span class="badge__label">Hoje</span>
    </div>
    <div class="badge" style="background: var(--color-next)">
      <span class="badge__label" style="color: var(--color-ink)">Próxima</span>
    </div>
    <div class="stamp-cancelada">
      <span class="stamp-cancelada__label">CANCELADA</span>
    </div>
    <div class="city-tag">
      <span class="city-tag__label">Campo Grande</span>
    </div>
  </div>
  <div class="row-buttons">
    <div class="button-primary">
      <svg class="button-primary__icon"><use href="assets/icons.svg#message-circle"/></svg>
      <span class="button-primary__label">Enviar no WhatsApp</span>
    </div>
    <div class="button-secondary">
      <svg class="button-secondary__icon"><use href="assets/icons.svg#copy"/></svg>
      <span class="button-secondary__label">Copiar texto</span>
    </div>
    <div class="icon-button">
      <svg class="icon-button__icon"><use href="assets/icons.svg#share-2"/></svg>
    </div>
  </div>
  <div class="row-sheet">
    <div class="day-sheet">
      <div class="day-sheet__binding"></div>
      <div class="day-sheet__perforation">
        <div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div><div class="day-sheet__perf-dot"></div>
      </div>
      <div class="day-sheet__head">
        <span class="day-sheet__numeral">18</span>
        <div class="day-sheet__text">
          <span class="day-sheet__weekday">DOMINGO</span>
          <span class="day-sheet__month">Outubro</span>
        </div>
        <div class="badge day-sheet__status-badge">
          <span class="badge__label">Hoje</span>
        </div>
      </div>
      <div class="day-sheet__lines"></div>
    </div>
    <div class="activity-line">
      <div class="activity-line__time-col">
        <div class="activity-line__time-plate">
          <span class="activity-line__time">11h</span>
        </div>
        <span class="activity-line__type">Festa</span>
      </div>
      <div class="activity-line__body">
        <span class="activity-line__title">Almoço dos Educadores</span>
        <div class="activity-line__org-row">
          <div class="activity-line__sector-mark"></div>
          <span class="activity-line__org">SIMTED</span>
        </div>
        <div class="activity-line__place-row">
          <svg class="activity-line__place-icon"><use href="assets/icons.svg#map-pin"/></svg>
          <span class="activity-line__place">Chácara do SIMTED</span>
        </div>
      </div>
      <div class="icon-button activity-line__share">
        <svg class="icon-button__icon"><use href="assets/icons.svg#share-2"/></svg>
      </div>
    </div>
  </div>
</div>
</body>
</html>
