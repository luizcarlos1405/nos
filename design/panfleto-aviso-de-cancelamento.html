<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panfleto · Aviso de cancelamento</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="../css/flyers.css">
<style>
.panfleto { width: 1080px; height: 1350px; overflow: hidden; }
</style>
</head>
<body>
<!-- Aviso de cancelamento (every cancelled activity gets it): "Cancelada" on the sky of its hour, without its sun, over the date and time the hand struck out; the land gives the reason, then the activity struck through.
     Drawn by js/flyer.js itself (assets/panfletos.js holds the activities, real rows of the agenda), so
     this artboard is always the flyer the site exports; ?atividade=<key> picks another activity and with
     it the sky of its hour (see assets/panfletos.js). -->
<div class="panfleto"></div>
<script type="module">
  import { drawFlyer } from './assets/panfletos.js';
  drawFlyer('notice', 'conselho');
</script>
</body>
</html>
