<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celular · Comércio · Busca sem resultado</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="assets/design.css">
<link rel="stylesheet" href="assets/components.css">
<style>
.celular-comercio-vazio { display: flex; flex-direction: column; align-items: flex-start; width: 390px; height: 844px; background: var(--color-ground); overflow: hidden; }
.status-bar { display: flex; align-items: center; justify-content: space-between; padding: 4px 28px 0 32px; align-self: stretch; height: 47px; flex-shrink: 0; background: var(--color-brand); }
.clock { font-family: Inter, system-ui, sans-serif; font-size: 16px; font-weight: 600; color: var(--color-on-ink); }
.system-icons { display: flex; align-items: center; gap: 6px; }
.system-icons svg { width: 18px; height: 18px; color: var(--color-on-ink); }
.header { display: flex; flex-direction: column; align-items: flex-start; align-self: stretch; flex-shrink: 0; background: var(--color-brand); }
.brand-row { display: flex; align-items: center; gap: 12px; padding: 6px 16px 10px; align-self: stretch; }
.lockup-text { display: flex; flex-direction: column; gap: 2px; }
.city { font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1.05; white-space: nowrap; color: var(--color-on-ink); }
.full-name { font-family: var(--font-ui); font-size: 14px; font-weight: 500; line-height: 1.2; white-space: nowrap; color: var(--color-on-ink); }
.site-tabs { padding: 0 12px; }
.tools { display: flex; flex-direction: column; gap: 12px; padding: 12px 16px 0; align-self: stretch; }
.chip-row { display: flex; align-items: center; gap: 8px; padding: 0 16px 12px; margin-top: 12px; align-self: stretch; flex-shrink: 0; overflow: hidden; -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 24px), transparent); }
.chip-row .chip { height: 44px; border-radius: 22px; }
.pad { display: flex; flex-direction: column; gap: 12px; padding: 0 16px 24px; align-self: stretch; }
.blank { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 24px 24px; text-align: center; }
.blank__icon { width: 40px; height: 40px; margin-bottom: 8px; color: var(--color-muted); }
.blank__title { max-width: 300px; font-family: var(--font-ui); font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--color-ink); text-wrap: balance; }
.blank__hint { max-width: 300px; font-family: var(--font-ui); font-size: 15px; font-weight: 500; line-height: 1.4; color: var(--color-muted); text-wrap: balance; }
.blank__actions { display: flex; flex-direction: column; align-items: stretch; gap: 4px; align-self: stretch; margin-top: 16px; }
.btn-text { display: flex; align-items: center; justify-content: center; height: 44px; font-family: var(--font-ui); font-size: 16px; font-weight: 700; color: var(--color-ink); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<!-- Comércio, phone, nothing for "pizza" in Comida: a blank sheet says so, as the calendar's empty
     filter does, and offers the way back. With COMMERCE_FORM_URL set, it also points to the form. -->
<div class="celular-comercio-vazio">
  <div class="status-bar">
    <span class="clock">9:41</span>
    <div class="system-icons">
      <svg><use href="assets/icons.svg#signal"/></svg>
      <svg><use href="assets/icons.svg#wifi"/></svg>
      <svg><use href="assets/icons.svg#battery-full"/></svg>
    </div>
  </div>
  <div class="header">
    <div class="brand-row">
      <div class="nos-mark">
        <div class="nos-mark__binding"></div>
        <div class="nos-mark__perforation">
          <div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div><div class="nos-mark__perf-dot"></div>
        </div>
        <div class="nos-mark__word-wrap"><span class="nos-mark__word">NOS</span></div>
      </div>
      <div class="lockup-text">
        <span class="city">Dourados/MS</span>
        <span class="full-name">Núcleo de Organização Social</span>
      </div>
    </div>
    <div class="site-tabs">
      <div class="site-tab">
        <svg class="site-tab__icon"><use href="assets/icons.svg#calendar-days"/></svg>
        <span class="site-tab__label">Calendário</span>
      </div>
      <div class="site-tab site-tab--current">
        <svg class="site-tab__icon"><use href="assets/icons.svg#store"/></svg>
        <span class="site-tab__label">Comércio</span>
      </div>
    </div>
  </div>

  <div class="tools">
    <div class="search-pill">
      <svg class="search-pill__icon"><use href="assets/icons.svg#search"/></svg>
      <span class="search-pill__text search-pill__text--typed">pizza</span>
      <div class="search-pill__clear"><svg class="search-pill__clear-icon"><use href="assets/icons.svg#x"/></svg></div>
    </div>
  </div>
  <div class="chip-row">
    <div class="chip"><span class="chip__label">Todos</span></div>
    <div class="chip" style="background: var(--color-ink); outline: 1px solid var(--color-ink)">
      <span class="chip__label" style="font-weight: 600; color: var(--color-on-ink)">Comida</span>
    </div>
    <div class="chip"><span class="chip__label">Serviços</span></div>
    <div class="chip"><span class="chip__label">Celular e informática</span></div>
  </div>

  <div class="pad">
    <div class="letter-sheet">
      <div class="sheet-top"></div>
      <div class="blank">
        <svg class="blank__icon"><use href="assets/icons.svg#search-x"/></svg>
        <span class="blank__title">Nenhum negócio de Comida com “pizza”</span>
        <span class="blank__hint">Confira se a palavra está certa ou tente outra parecida: lanche, salgado, bolo.</span>
        <div class="blank__actions">
          <div class="button-secondary"><span class="button-secondary__label">Ver todos os negócios</span></div>
          <div class="btn-text">Buscar em todas as categorias</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
