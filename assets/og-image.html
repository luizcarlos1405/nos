<!doctype html>
<!-- Source of assets/og-image.png (1200 × 630), the link preview of WhatsApp, Telegram and the social
     networks (rendered by assets/render.cjs). The home's first view at poster scale: the sky at dawn in
     flat bands, the big sun rising at the right behind the woven band (assets/faixa.svg, provisional art),
     the clay below; on the sky at the left, the NOS mark (MARK in js/icons.js: the letters in ink, the O in
     its urucum loop), the city in Bricolage and the full name. WhatsApp shows this image whole, above the
     title, in a bubble about 330px wide: the type is sized for that (120px and 40px here are about 33px and
     11px there). Nothing in it dates. Colours are the roles of css/theme.css (the light theme at dawn); the
     texts come from js/config.js. -->
<html lang="pt-BR" data-scheme="light" data-sky="dawn">
<head>
<meta charset="utf-8">
<title>Prévia do link</title>
<link rel="stylesheet" href="../css/theme.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: var(--role-ground); color: var(--role-sky-ink); -webkit-font-smoothing: antialiased; }

  /* The sky: 506px of flat bands counted up from the horizon, then the band (64px) and the clay. */
  .sky {
    --h5: 34px;
    --h4: 76px;
    --h3: 124px;
    --h2: 182px;
    position: absolute;
    inset: 0 0 auto;
    height: 506px;
    overflow: hidden;
    background: linear-gradient(to top,
      var(--role-sky-5) 0 var(--h5),
      var(--role-sky-4) 0 var(--h4),
      var(--role-sky-3) 0 var(--h3),
      var(--role-sky-2) 0 var(--h2),
      var(--role-sky-1) 0);
  }
  .band { position: absolute; left: 0; right: 0; top: 506px; height: 64px; background: url(faixa.svg) 0 50% / auto 100% repeat-x; }

  /* The sun (the site's #astro drawing): its disc centred 20px under the horizon, running off the right. */
  .sun { position: absolute; right: -60px; bottom: -260px; width: 560px; height: 560px; overflow: visible; }
  .sun circle { fill: var(--role-astro); }
  .sun path { fill: none; stroke: var(--role-sky-hand); stroke-width: 7px; stroke-linecap: round; stroke-linejoin: round; }

  .lockup { position: absolute; left: 84px; top: 62px; display: flex; flex-direction: column; align-items: flex-start; }
  .mark { display: block; width: 320px; height: 193px; overflow: visible; } /* the drawing is 1493:902 */
  .mark-letters { fill: var(--role-sky-ink); }
  .mark-loop { fill: var(--role-sky-hand); }
  .place { margin-top: 22px; font: 800 120px/1 var(--font-display); letter-spacing: -0.03em; white-space: nowrap; }
  .full { margin-top: 18px; font: 500 40px/1.2 var(--font-ui); color: var(--role-sky-ink-soft); white-space: nowrap; }
</style>
</head>
<body>
  <div class="sky">
    <svg class="sun" viewBox="0 0 120 120" aria-hidden="true"><circle cx="58" cy="60" r="49"/><path vector-effect="non-scaling-stroke" d="M78 9C56 4 22 12 12 38C3 64 20 104 56 108C92 112 116 88 112 56C109 28 92 7 66 5.5C54 5 40 10 28 19"/></svg>
    <div class="lockup">
      <svg class="mark" id="mark" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
      <p class="place" id="place"></p>
      <p class="full" id="full"></p>
    </div>
  </div>
  <div class="band"></div>
<script type="module">
  import { APP_FULL_NAME, CITY } from '../js/config.js';
  import { MARK } from '../js/icons.js';

  const NS = 'http://www.w3.org/2000/svg';
  const mark = document.getElementById('mark');
  mark.setAttribute('viewBox', MARK.viewBox);
  for (const [cls, d] of [['mark-letters', MARK.letters], ['mark-loop', MARK.loop]]) {
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', cls);
    path.setAttribute('d', d);
    mark.append(path);
  }
  document.getElementById('place').textContent = CITY.split('/')[0];
  document.getElementById('full').textContent = APP_FULL_NAME;

  // The band is a background image and the type a web font: wait for both.
  const band = new Promise((resolve) => {
    const image = new Image();
    image.onload = image.onerror = resolve;
    image.src = new URL('faixa.svg', location.href).href;
  });
  const fonts = Promise.all(['800 120px "Bricolage Grotesque"', '500 40px Inter'].map((font) => document.fonts.load(font)));
  Promise.all([band, fonts]).then(() => document.fonts.ready).then(() => {
    document.documentElement.dataset.ready = '';
  });
</script>
</body>
</html>
