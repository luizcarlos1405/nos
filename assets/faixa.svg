<!-- A faixa: PROVISIONAL art, the horizon of the site (css/style.css .band). Drawn only from the
     structure of a taquara twill (a broken twill: the strips go over and under two at a time, the
     diagonal turns every six) with an urucum selvage; no one's grafismo is copied. The real band will be
     made, signed and paid for by artists of the Reserva Indígena de Dourados (design/faixa-pesquisa.html);
     it replaces this file, and the credit under the pages changes with it. One tile, repeated sideways. -->
